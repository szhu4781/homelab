---
- name: Install Wireguard and iptables
  apt:
    name:
      - wireguard
      - iptables
    state: present

- name: Enable IP forwarding
  sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    state: present
    reload: yes

- name: Persist IP forwarding
  lineinfile:
    path: /etc/sysctl.conf
    line: 'net.ipv4.ip_forward=1'
    state: present

- name: Copy Wireguard server config
  copy:
    src: wg0.conf
    dest: /etc/wireguard/wg0.conf
    mode: '0600'

- name: Start Wireguard
  shell: wg-quick up wg0
  ignore_errors: yes